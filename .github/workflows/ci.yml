name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified Persona transition
        if: github.ref == 'refs/heads/persona-ui-camera-verified-v2'
        run: python3 scripts/apply-persona-camera-v2.py
      - name: Commit verified Persona transition
        if: github.ref == 'refs/heads/persona-ui-camera-verified-v2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No application changes"
          else
            git commit -m "style: Personaメニューを検証済み3Dカメラ遷移へ更新"
            git push origin HEAD:persona-ui-camera-verified-v2
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
