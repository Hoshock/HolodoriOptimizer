name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload Persona UI verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-ui-verification
          path: |
            /tmp/persona-after.png
            /tmp/persona-before.yml
          if-no-files-found: error
      - run: pnpm test
      - run: pnpm build
