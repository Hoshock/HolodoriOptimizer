name: Persona UI Motion Pass

on:
  push:
    branches:
      - persona-ui-motion-pass-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: persona-ui-motion-pass-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Link motion stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/persona-ui/index.html")
          text = path.read_text()
          link = '    <link rel="stylesheet" href="./motion.css" />\n'
          if link not in text:
              text = text.replace("  </head>", link + "  </head>", 1)
              path.write_text(text)
          PY
      - run: pnpm check --fix
      - name: Commit formatted UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/persona-ui/index.html public/persona-ui/motion.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "style: Persona UIのメニュー演出を強化"
            git push origin HEAD:persona-ui-motion-pass-v2
          fi
